<div class="login-container">
    <div class="login-form-section">
        <div class="brand">
            <div class="brand-logo">
                <img src="assets/images/logo.png" alt="SmartPark Logo" />
            </div>
            <span class="brand-name">SMARTPARK</span>
        </div>

        <h1 class="login-header">
            Enter Your <span class="highlight">Email &</span><br>
            <span class="highlight-dark">Password</span>
        </h1>

        <form class="login-form" (submit)="onLogin($event)">
            <div class="form-group" [class.has-error]="emailError">
                <label for="email">EMAIL ADDRESS <span class="required">*</span></label>
                <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="example@gmail.com" />
                <div class="error-message" *ngIf="emailError">{{ emailError }}</div>
            </div>

            <div class="form-group" [class.has-error]="passwordError">
                <label for="password">PASSWORD <span class="required">*</span></label>
                <div class="password-input-wrapper">
                    <input [type]="passwordVisible ? 'text' : 'password'" id="password" name="password"
                        [(ngModel)]="password" placeholder="••••••••••••••••" />
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility"
                        (click)="togglePasswordVisibility()">
                        @if (passwordVisible) {
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                        } @else {
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        }
                    </button>
                </div>
                <div class="error-message" *ngIf="passwordError">{{ passwordError }}</div>
            </div>

            <div class="form-actions">
                <label class="checkbox-container">
                    <input type="checkbox" />
                    <span class="checkmark"></span>
                    Keep me logged in
                </label>
                <a href="#" class="forgot-password" (click)="forgotPassword($event)">Forgot Password?</a>
            </div>

            <div class="login-error-message" *ngIf="loginError">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="alert-icon">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ loginError }}</span>
            </div>

            <button type="submit" class="btn-login" [disabled]="isLoading">
                <span *ngIf="!isLoading">Login</span>
                <span *ngIf="isLoading" class="loader"></span>
            </button>
        </form>
    </div>
    <div class="login-image-section">
        <div class="image-wrapper">
            <img src="assets/images/garage.png" alt="Indoor Parking Garage" />
        </div>
    </div>
</div>
